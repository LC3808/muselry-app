flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  # 메인 아이콘 (iOS는 alpha 제거 필요)
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true

  # Android adaptive icon (Android 8.0+)
  adaptive_icon_background: "#FBE9D0"
  adaptive_icon_foreground: "assets/branding/adaptive_icon_foreground.png"

  # Android 13+ themed icon (단색)
  adaptive_icon_monochrome: "assets/branding/adaptive_icon_monochrome.png"

  min_sdk_android: 21
